# Xcode project definition. Generate the .xcodeproj with:  brew install xcodegen && xcodegen
name: Unreel
options:
  bundleIdPrefix: com.unreel
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Unreel:
    type: application
    platform: iOS
    sources:
      - path: Unreel
        excludes: ["Web/**"]
      - path: Unreel/Web
        buildPhase: resources
    info:
      path: Unreel/Info.plist
      properties:
        CFBundleDisplayName: Unreel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Lets you take photos and videos to post.
        NSMicrophoneUsageDescription: Lets you record videos and voice messages.
        NSPhotoLibraryUsageDescription: Lets you pick photos and videos to post.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unreel.app
