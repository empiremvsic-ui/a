name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The GitHub runner already has the Android SDK installed.
      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Unreel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Unreel-apk
          path: Unreel.apk

      # Publish to a "latest" release so you can download it straight from your phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Unreel.apk \
            --title "Unreel (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download Unreel.apk on your Android phone and open it to install." \
            --target "$GITHUB_SHA"
